server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin from the browser's point of view: nginx forwards anything
    # under /api to the backend container so the frontend never needs CORS.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Fail fast instead of nginx's 60s default when the backend is unreachable.
        proxy_connect_timeout 3s;
    }

    # Client-side routing: any non-file path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
